<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockSync">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
  <title>StockSync-Login</title>
  <link rel="stylesheet" href="styles.css?v=20260717-orc-logistica-admin">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 18px;
      overflow-y: auto;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(124, 58, 237, 0.12) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 50%);
    }

    .login-wrap {
      position: relative;
      width: 360px;
      max-width: calc(100vw - 32px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 26px 28px;
      box-shadow: var(--shadow-lg);
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .login-brand-logo {
      width: 238px;
      max-width: 100%;
      margin-bottom: 0;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text3);
      margin-top: 0;
    }

    .forgot {
      font-size: 12px;
      color: var(--accent2);
      cursor: pointer;
      text-align: right;
      display: block;
      margin-top: -8px;
      margin-bottom: 12px;
    }

    .login-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text3);
      margin-top: 14px;
    }

    .login-footer a {
      color: var(--accent2);
      cursor: pointer;
    }

    .account-choice-overlay {
      position: fixed;
      inset: 0;
      z-index: 1002;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(6px);
    }

    .account-choice-overlay.open {
      display: flex;
    }

    .account-choice-modal {
      width: min(430px, 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow-lg);
      padding: 22px;
    }

    .account-choice-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .account-choice-sub {
      color: var(--text3);
      font-size: 12.5px;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .account-choice-list {
      display: grid;
      gap: 10px;
    }

    .account-choice-card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface2);
      color: var(--text);
      padding: 14px;
      cursor: pointer;
      font-family: var(--font);
      transition: border-color 0.16s, background 0.16s, transform 0.16s;
    }

    .account-choice-card:hover {
      border-color: rgba(124, 58, 237, 0.55);
      background: var(--surface3);
      transform: translateY(-1px);
    }

    .account-choice-card strong {
      display: block;
      font-size: 14.5px;
      margin-bottom: 4px;
    }

    .account-choice-card span {
      display: block;
      color: var(--text3);
      font-size: 12.5px;
      line-height: 1.35;
    }

    .account-choice-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
    }

    .pass-wrap {
      position: relative;
    }

    .code-helper {
      margin-top: -10px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--accent2);
      cursor: pointer;
      display: inline-flex;
      background: none;
      border: none;
      font-family: var(--font);
      padding: 0;
    }

    .company-code-panel {
      display: none;
      margin-top: -8px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface2);
    }

    .company-code-panel.open { display: block; }

    .company-code-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }

    .company-code-item:last-child { border-bottom: none; }

    .company-code-name { color: var(--text2); }

    .company-code-value {
      color: var(--text);
      font-family: var(--mono);
      font-weight: 700;
      cursor: pointer;
    }

    .login-wrap .form-group {
      margin-bottom: 14px;
    }

    .login-wrap .form-input {
      padding-top: 9px;
      padding-bottom: 9px;
    }

    @media (max-width: 520px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .login-wrap {
        width: 100%;
        max-width: 390px;
        margin: 12px auto;
        padding: 20px 18px;
        border-radius: 12px;
      }

      .login-logo {
        margin-bottom: 16px;
      }

      .login-brand-logo {
        width: min(220px, 82vw);
      }

      .login-sub {
        font-size: 12.5px;
      }

      .company-code-item {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .forgot {
        text-align: left;
      }

      .account-choice-modal {
        padding: 18px;
      }
    }

    @media (max-width: 380px) {
      .login-wrap {
        padding: 18px 14px;
      }

      .login-brand-logo {
        width: min(198px, 78vw);
      }
    }
  </style>
</head>

<body>
  <div class="login-bg"></div>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="brand-logo-frame login-brand-logo">
        <img src="assets/logo-stocksync-login.png" alt="StockSync - Controle, organize e sincronize">
      </div>
      <div style="text-align:center">
        <div class="login-sub">Faça login para continuar</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Código da Empresa</label>
      <input class="form-input" type="text" placeholder="Ex: tcnk">
    </div>
    <button class="code-helper" id="mostrarCodigos" type="button">Não lembro o código</button>
    <div class="company-code-panel" id="painelCodigos"></div>

    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input class="form-input" type="email" placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label class="form-label">Senha</label>
      <div class="pass-wrap">
        <input id="senhaInput" class="form-input" type="password" style="padding-right:40px"> <button type="button"
          class="eye-btn" onclick="toggleSenha()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </div>

    <a class="forgot" id="forgotLink">Esqueceu a senha?</a>

    <button id="entrarSistemaBtn" type="button" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px 12px">Entrar</button>

    <div class="login-footer">
      Não tem conta?
      <a id="abrirEscolhaConta">Criar conta</a>
    </div>
  </div>
  <div class="account-choice-overlay" id="escolhaContaOverlay">
    <div class="account-choice-modal">
      <div class="account-choice-title">Criar conta</div>
      <div class="account-choice-sub">Escolha como você quer acessar o StockSync.</div>
      <div class="account-choice-list">
        <button class="account-choice-card" type="button" id="criarContaFuncionario">
          <strong>Funcionário</strong>
          <span>Solicitar acesso ao ambiente de uma empresa usando o código dela.</span>
        </button>
        <button class="account-choice-card" type="button" id="criarContaEmpresa">
          <strong>Empresa</strong>
          <span>Criar um novo ambiente empresarial e cadastrar o primeiro administrador.</span>
        </button>
      </div>
      <div class="account-choice-actions">
        <button class="btn btn-secondary" type="button" id="fecharEscolhaConta">Cancelar</button>
      </div>
    </div>
  </div>
  <script src="app.js?v=20260717-orc-logistica-admin"></script>
  <script>
    function toggleSenha() {
      const input = document.getElementById("senhaInput");
      input.type = input.type === "password" ? "text" : "password";
    }

    document.getElementById("forgotLink").addEventListener("click", function () {
      GE.mensagem("Procure um administrador para redefinir sua senha.", "info");
    });

    const escolhaContaOverlay = document.getElementById("escolhaContaOverlay");

    document.getElementById("abrirEscolhaConta").addEventListener("click", function () {
      escolhaContaOverlay.classList.add("open");
    });

    document.getElementById("fecharEscolhaConta").addEventListener("click", function () {
      escolhaContaOverlay.classList.remove("open");
    });

    escolhaContaOverlay.addEventListener("click", function (event) {
      if (event.target === escolhaContaOverlay) escolhaContaOverlay.classList.remove("open");
    });

    document.getElementById("criarContaFuncionario").addEventListener("click", function () {
      window.location.href = "02-cadastro-funcionario.html?novo=funcionario";
    });

    document.getElementById("criarContaEmpresa").addEventListener("click", function () {
      window.location.href = "02-cadastro-funcionario.html?novo=empresa";
    });

    function textoSeguro(texto) {
      return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.getElementById("mostrarCodigos").addEventListener("click", function () {
      const painel = document.getElementById("painelCodigos");
      const empresas = GE.empresas();

      if (!empresas.length) {
        GE.mensagem("Nenhuma empresa foi criada neste navegador ainda.", "info");
        return;
      }

      painel.innerHTML = empresas.map((empresa) => `
        <div class="company-code-item">
          <span class="company-code-name">${textoSeguro(empresa.nome)}</span>
          <button class="company-code-value" type="button" onclick="selecionarCodigoEmpresa('${textoSeguro(empresa.codigo || empresa.id)}')">${textoSeguro(empresa.codigo || empresa.id)}</button>
        </div>
      `).join("");
      painel.classList.toggle("open");
    });

    function selecionarCodigoEmpresa(codigo) {
      document.querySelectorAll(".form-input")[0].value = codigo;
      document.getElementById("painelCodigos").classList.remove("open");
      GE.mensagem(`Código ${codigo} preenchido.`, "success");
    }

    function entrarSistema(event) {
      if (event) event.preventDefault();

      const campos = document.querySelectorAll(".form-input");
      const codigoEmpresa = campos[0].value.trim();
      const email = campos[1].value.trim();
      const senha = campos[2].value;

      if (!codigoEmpresa || !email || !senha) {
        GE.mensagem("Informe o código da empresa, e-mail e senha.", "warning");
        return;
      }

      let usuario = null;
      try {
        usuario = GE.autenticar(email, senha, codigoEmpresa);
      } catch (erro) {
        GE.mensagem(`Erro ao acessar: ${erro.message}`, "error");
        return;
      }

      if (!usuario) {
        GE.mensagem("Código da empresa, e-mail ou senha incorretos.", "error");
        return;
      }

      if (usuario.erro) {
        GE.mensagem(usuario.erro, "warning");
        return;
      }

      GE.mensagem(`Login realizado com sucesso em ${usuario.empresaNome}!`, "success", { tempo: 1200 });
      setTimeout(() => window.location.href = "03-dashboard.html", 650);
    }

    window.entrarSistema = entrarSistema;
    document.getElementById("entrarSistemaBtn").addEventListener("click", entrarSistema);
    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter") entrarSistema(event);
    });
  </script>
  <script src="pwa.js?v=20260717-orc-logistica-admin" defer></script>
</body>

</html>
